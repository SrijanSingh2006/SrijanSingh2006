<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Srijan Singh — AI/ML developer</title>
  <desc id="desc">A violet systems-inspired banner for an AI/ML developer focused on agentic workflows, retrieval, and evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171321"/>
      <stop offset="1" stop-color="#21182d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8f6cc3" stop-opacity=".33"/>
      <stop offset="1" stop-color="#8f6cc3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d9c9f2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <ellipse cx="1000" cy="150" rx="300" ry="210" fill="url(#halo)"/>
  <g fill="none" stroke="#c4a8ee" stroke-opacity=".28" stroke-width="1.5">
    <path d="M800 225h95l42-42h84l36-36h86"/>
    <path d="M870 93h80l40 40h118"/>
    <path d="M970 260v-42l35-35"/>
    <path d="M1084 91v33"/>
  </g>
  <g fill="#c4a8ee">
    <circle cx="800" cy="225" r="4"/>
    <circle cx="1035" cy="183" r="4"/>
    <circle cx="1143" cy="147" r="4"/>
    <circle cx="870" cy="93" r="4"/>
    <circle cx="1108" cy="133" r="4"/>
    <circle cx="1005" cy="183" r="4"/>
  </g>
  <text x="72" y="112" fill="#f6f0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Srijan Singh</text>
  <text x="76" y="164" fill="#c4a8ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="3">AI / ML DEVELOPER</text>
  <text x="76" y="210" fill="#d0c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Agentic workflows · RAG · Evaluation</text>
  <rect x="76" y="246" width="78" height="4" rx="2" fill="#a78bfa"/>
  <text x="168" y="252" fill="#978da4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">BUILD WITH INTENT</text>
</svg>
